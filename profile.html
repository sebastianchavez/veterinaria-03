<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil · Huellitas Vet</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#e07856', secondary: '#3fb8af', accent: '#f4c167' }, fontFamily: { display: ['Poppins'], sans: ['Nunito'] } } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="profile.html" class="bg-app text-gray-800 font-sans">
  <div id="appHeader"></div>

  <main class="pb-20">
    <section class="bg-card border-b border-soft py-8">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <img id="userFoto" src="" alt="" class="w-16 h-16 rounded-2xl object-cover border-2 border-primary/30" />
            <div>
              <p class="text-xs uppercase tracking-widest text-muted font-bold">Mi cuenta</p>
              <h1 class="text-2xl md:text-3xl font-bold font-display" style="color:var(--color-text);">Hola, <span id="userNombre"></span></h1>
              <p class="text-sm text-muted" id="userEmail"></p>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            <button class="tab-button active" data-tab="historial">📋 Historial</button>
            <button class="tab-button" data-tab="mascotas">🐾 Mis mascotas</button>
            <button class="tab-button" data-tab="datos">👤 Mis datos</button>
          </div>
        </div>
      </div>
    </section>

    <section class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div id="tab-historial" class="tab-pane">
        <div class="flex flex-wrap gap-2 mb-6">
          <button class="filter-chip active" data-filtro="todas">Todas</button>
          <button class="filter-chip" data-filtro="pendiente">Pendientes</button>
          <button class="filter-chip" data-filtro="confirmada">Confirmadas</button>
          <button class="filter-chip" data-filtro="pagada">Pagadas</button>
          <button class="filter-chip" data-filtro="completada">Completadas</button>
          <button class="filter-chip" data-filtro="anulada">Anuladas</button>
        </div>
        <div id="historialList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <div id="tab-mascotas" class="tab-pane hidden">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-xl font-bold font-display" style="color:var(--color-text);">Mis mascotas registradas</h2>
            <p class="text-sm text-muted">Gestiona las mascotas asociadas a tu cuenta</p>
          </div>
          <button id="btnNewMascota" class="btn-primary text-sm">+ Agregar mascota</button>
        </div>
        <div id="mascotasList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <div id="tab-datos" class="tab-pane hidden">
        <div class="max-w-2xl">
          <div class="card p-7 mb-6">
            <h2 class="text-xl font-bold font-display mb-5" style="color:var(--color-text);">Datos personales</h2>
            <form id="formDatos" class="space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="label-text">Nombre</label><input id="inpNombre" class="input-field" required /></div>
                <div><label class="label-text">Email</label><input id="inpEmail" type="email" class="input-field" required /></div>
                <div><label class="label-text">Teléfono</label><input id="inpTelefono" class="input-field" /></div>
                <div><label class="label-text">DNI</label><input id="inpDni" class="input-field" /></div>
              </div>
              <button type="submit" class="btn-primary">Guardar cambios</button>
            </form>
          </div>
          <div class="card p-7">
            <h3 class="font-bold font-display text-lg mb-4">Cambiar contraseña</h3>
            <form id="formPass" class="space-y-4">
              <div><label class="label-text">Contraseña actual</label><input type="password" class="input-field" placeholder="••••••" /></div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="label-text">Nueva contraseña</label><input type="password" class="input-field" placeholder="••••••" /></div>
                <div><label class="label-text">Confirmar</label><input type="password" class="input-field" placeholder="••••••" /></div>
              </div>
              <button type="submit" class="btn-secondary">Cambiar contraseña</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="appFooter"></div>

  <style>
    .filter-chip {
      padding: .5rem 1rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: .85rem;
      cursor: pointer;
      background: var(--color-bg-soft);
      color: var(--color-text-muted);
      border: 2px solid transparent;
      transition: all .2s;
      font-family: 'Poppins', sans-serif;
    }
    .filter-chip:hover { background: rgba(224, 120, 86, .08); color: var(--color-primary); }
    .filter-chip.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
  </style>

  <script src="js/main.js"></script>
  <script>
    if (!Auth.requireAuth()) {}

    let currentTab = 'historial';
    let currentFilter = 'todas';

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      document.querySelector(`.tab-button[data-tab="${tab}"]`).classList.add('active');
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
    }

    function renderHistorial() {
      const user = Auth.current();
      let reservas = Reservas.list(user.id);
      if (currentFilter !== 'todas') reservas = reservas.filter(r => r.estado === currentFilter);

      const listEl = document.getElementById('historialList');
      if (reservas.length === 0) {
        listEl.innerHTML = `
          <div class="col-span-full card p-10 text-center">
            <div class="text-5xl mb-4">📅</div>
            <h3 class="text-lg font-bold font-display mb-2" style="color:var(--color-text);">Sin reservas</h3>
            <p class="text-sm text-muted mb-5">No tienes reservas ${currentFilter !== 'todas' ? 'en este estado' : 'todavía'}.</p>
            <a href="booking.html" class="btn-primary">Reservar ahora</a>
          </div>`;
        return;
      }

      listEl.innerHTML = reservas.sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).map(r => {
        const s = SERVICIOS.find(x => x.id === r.servicioId);
        const m = Mascotas.get(r.mascotaId);
        return `
          <a href="my-bookings.html?id=${r.id}" class="card p-5 flex gap-4 hover:border-primary">
            <img src="${s ? s.imagen : ''}" class="w-20 h-20 rounded-2xl object-cover flex-shrink-0" alt="" />
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2 mb-1">
                <h4 class="font-bold font-display truncate" style="color:var(--color-text);">${s ? s.nombre : '—'}</h4>
                ${UI.statusBadge(r.estado)}
              </div>
              <p class="text-xs text-muted mb-1">${m ? m.nombre : '—'} · ${formatDate(r.fecha)} · ${r.hora}</p>
              <div class="flex items-center justify-between mt-3">
                <span class="text-primary font-bold font-display">${formatCurrency(r.precio)}</span>
                <span class="text-xs text-primary font-bold">Ver detalle →</span>
              </div>
            </div>
          </a>`;
      }).join('');
    }

    function renderMascotas() {
      const user = Auth.current();
      const mascotas = Mascotas.list(user.id);
      const listEl = document.getElementById('mascotasList');
      if (mascotas.length === 0) {
        listEl.innerHTML = `<div class="col-span-full card p-10 text-center"><div class="text-5xl mb-4">🐾</div><p class="text-sm text-muted mb-5">Aún no tienes mascotas registradas.</p><button class="btn-primary" onclick="openPetModal()">Agregar la primera</button></div>`;
        return;
      }
      listEl.innerHTML = mascotas.map(m => `
        <div class="card p-5">
          <div class="flex items-center gap-3 mb-3">
            <div class="pet-avatar text-2xl">${UI.petEmoji(m.especie)}</div>
            <div class="flex-1 min-w-0">
              <h4 class="font-bold font-display truncate" style="color:var(--color-text);">${m.nombre}</h4>
              <p class="text-xs text-muted">${m.raza || 'Sin raza'}</p>
            </div>
          </div>
          <div class="space-y-1 text-sm text-muted">
            <p>Edad: <span class="font-bold" style="color:var(--color-text);">${m.edad || '—'}</span></p>
            <p>Peso: <span class="font-bold" style="color:var(--color-text);">${m.peso || '—'}</span></p>
            <p>Sexo: <span class="font-bold" style="color:var(--color-text);">${m.sexo || '—'}</span></p>
            ${m.notas ? `<p class="text-xs italic mt-2">"${m.notas}"</p>` : ''}
          </div>
          <div class="flex gap-2 mt-4 pt-4 border-t border-soft">
            <button class="btn-ghost flex-1 text-xs justify-center" onclick="openPetModal('${m.id}')">Editar</button>
            <button class="btn-ghost flex-1 text-xs justify-center text-red-500" onclick="deletePet('${m.id}')">Eliminar</button>
          </div>
        </div>
      `).join('');
    }

    function fillDatos() {
      const u = Auth.current();
      document.getElementById('inpNombre').value = u.nombre;
      document.getElementById('inpEmail').value = u.email;
      document.getElementById('inpTelefono').value = u.telefono || '';
      document.getElementById('inpDni').value = u.dni || '';
      document.getElementById('userFoto').src = u.foto;
      document.getElementById('userNombre').textContent = u.nombre.split(' ')[0];
      document.getElementById('userEmail').textContent = u.email;
    }

    function openPetModal(id = null) {
      const m = id ? Mascotas.get(id) : null;
      const isEdit = !!m;
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal-content">
          <h3 class="font-display font-bold text-xl mb-5" style="color:var(--color-text);">${isEdit ? 'Editar' : 'Nueva'} mascota</h3>
          <form id="petForm" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div><label class="label-text">Nombre *</label><input id="pNombre" class="input-field text-sm" required value="${m ? m.nombre : ''}" /></div>
              <div><label class="label-text">Especie</label>
                <select id="pEspecie" class="input-field text-sm">${ESPECIES.map(e => `<option value="${e.id}" ${m && m.especie === e.id ? 'selected' : ''}>${e.icon} ${e.label}</option>`).join('')}</select>
              </div>
              <div><label class="label-text">Raza</label><input id="pRaza" class="input-field text-sm" value="${m ? m.raza || '' : ''}" /></div>
              <div><label class="label-text">Edad</label><input id="pEdad" class="input-field text-sm" value="${m ? m.edad || '' : ''}" placeholder="2 años" /></div>
              <div><label class="label-text">Peso</label><input id="pPeso" class="input-field text-sm" value="${m ? m.peso || '' : ''}" placeholder="5 kg" /></div>
              <div><label class="label-text">Sexo</label>
                <select id="pSexo" class="input-field text-sm">
                  <option value="">—</option>
                  <option value="macho" ${m && m.sexo === 'macho' ? 'selected' : ''}>Macho</option>
                  <option value="hembra" ${m && m.sexo === 'hembra' ? 'selected' : ''}>Hembra</option>
                </select>
              </div>
            </div>
            <div><label class="label-text">Notas</label><textarea id="pNotas" class="input-field text-sm" rows="2" placeholder="Alergias, comportamiento, etc.">${m ? m.notas || '' : ''}</textarea></div>
            <div class="flex justify-end gap-2 mt-4">
              <button type="button" class="btn-ghost" id="petCancel">Cancelar</button>
              <button type="submit" class="btn-primary">${isEdit ? 'Guardar' : 'Agregar'}</button>
            </div>
          </form>
        </div>`;
      document.body.appendChild(back);
      const close = () => back.remove();
      document.getElementById('petCancel').addEventListener('click', close);
      back.addEventListener('click', (e) => { if (e.target === back) close(); });
      document.getElementById('petForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = {
          nombre: document.getElementById('pNombre').value.trim(),
          especie: document.getElementById('pEspecie').value,
          raza: document.getElementById('pRaza').value.trim(),
          edad: document.getElementById('pEdad').value.trim(),
          peso: document.getElementById('pPeso').value.trim(),
          sexo: document.getElementById('pSexo').value,
          notas: document.getElementById('pNotas').value.trim()
        };
        if (!data.nombre) { UI.toast('El nombre es obligatorio', 'error'); return; }
        if (isEdit) { Mascotas.update(id, data); UI.toast('Mascota actualizada', 'success'); }
        else { const user = Auth.current(); Mascotas.create({ ...data, userId: user.id }); UI.toast('Mascota agregada', 'success'); }
        close();
        renderMascotas();
      });
    }

    window.deletePet = (id) => {
      UI.modal({
        title: '¿Eliminar mascota?',
        message: 'Esta acción no se puede deshacer.',
        cancelText: 'Cancelar',
        confirmText: 'Eliminar',
        onClose: (ok) => {
          if (ok) { Mascotas.remove(id); UI.toast('Mascota eliminada', 'success'); renderMascotas(); }
        }
      });
    };

    window.openPetModal = openPetModal;

    document.addEventListener('DOMContentLoaded', () => {
      fillDatos();
      renderHistorial();
      renderMascotas();

      document.querySelectorAll('.tab-button').forEach(b => {
        b.addEventListener('click', () => setTab(b.dataset.tab));
      });
      document.querySelectorAll('[data-filtro]').forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll('[data-filtro]').forEach(x => x.classList.remove('active'));
          c.classList.add('active');
          currentFilter = c.dataset.filtro;
          renderHistorial();
        });
      });
      document.getElementById('btnNewMascota').addEventListener('click', () => openPetModal());

      document.getElementById('formDatos').addEventListener('submit', (e) => {
        e.preventDefault();
        const user = Auth.current();
        Auth.update(user.id, {
          nombre: document.getElementById('inpNombre').value.trim(),
          email: document.getElementById('inpEmail').value.trim(),
          telefono: document.getElementById('inpTelefono').value.trim(),
          dni: document.getElementById('inpDni').value.trim()
        });
        UI.toast('Datos actualizados correctamente', 'success');
        fillDatos();
      });

      document.getElementById('formPass').addEventListener('submit', (e) => {
        e.preventDefault();
        UI.toast('Contraseña actualizada (demo)', 'success');
        e.target.reset();
      });
    });
  </script>
</body>
</html>
