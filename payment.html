<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago · Huellitas Vet</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#e07856', secondary: '#3fb8af', accent: '#f4c167' }, fontFamily: { display: ['Poppins'], sans: ['Nunito'] } } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="payment.html" class="bg-app text-gray-800 font-sans">
  <div id="appHeader"></div>

  <main class="pb-20">
    <section class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div class="text-center mb-10">
        <div class="inline-flex chip chip-primary mb-3">Pago seguro</div>
        <h1 class="text-3xl md:text-5xl font-bold font-display" style="color:var(--color-text);">Realizar el pago</h1>
        <p class="text-muted mt-2">Elige tu método preferido</p>
      </div>

      <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
          <div class="card p-7">
            <h3 class="font-bold font-display text-lg mb-5" style="color:var(--color-text);">1. Selecciona el método de pago</h3>
            <div id="metodos" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
          </div>

          <div id="metodoForm" class="card p-7"></div>

          <div class="card p-7">
            <h3 class="font-bold font-display text-lg mb-5" style="color:var(--color-text);">3. Confirma y paga</h3>
            <label class="flex items-start gap-2 text-sm text-muted mb-5">
              <input type="checkbox" id="chkAcepto" class="mt-1 w-4 h-4 accent-primary" />
              <span>Confirmo que la información de pago es correcta y autorizo el cobro por el monto indicado.</span>
            </label>
            <button id="btnPagar" class="btn-primary w-full justify-center text-base" style="padding:1rem;">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              Pagar <span id="btnPagarTotal">CLP$ 0</span>
            </button>
            <p class="text-xs text-muted text-center mt-4 flex items-center justify-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              Tus datos están protegidos con encriptación SSL
            </p>
          </div>
        </div>

        <aside>
          <div class="card p-6 lg:sticky lg:top-28">
            <h3 class="font-bold font-display text-lg mb-4 flex items-center gap-2" style="color:var(--color-text);">
              <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              Resumen
            </h3>
            <div id="resumenPago" class="text-sm space-y-3"></div>
            <div class="border-t border-soft pt-3 mt-3 flex justify-between text-base items-center">
              <span class="font-bold" style="color:var(--color-text);">Total:</span>
              <span id="totalPago" class="text-2xl font-bold font-display text-primary">CLP$ 0</span>
            </div>
            <div class="mt-5 p-4 bg-soft rounded-xl">
              <p class="text-xs text-muted leading-relaxed">
                <strong class="text-primary">💡 Política:</strong> Reembolso completo si cancelas con 24h de anticipación.
              </p>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="appFooter"></div>

  <script src="js/main.js"></script>
  <script>
    if (!Auth.requireAuth()) {}

    const params = new URLSearchParams(location.search);
    let id = params.get('id') || (PagoDraft.get() && PagoDraft.get().reservaId);
    let reserva = id ? Reservas.get(id) : null;

    if (!reserva) {
      document.querySelector('main').innerHTML = '<div class="container mx-auto p-10 text-center"><p>No hay una reserva pendiente de pago.</p><a href="profile.html" class="btn-primary mt-5">Ir a mi perfil</a></div>';
    } else {
      PagoDraft.set({ reservaId: reserva.id });
    }

    let metodoSeleccionado = reserva && reserva.metodoPago ? reserva.metodoPago : null;

    function renderResumen() {
      const s = SERVICIOS.find(x => x.id === reserva.servicioId);
      const v = VETERINARIOS.find(x => x.id === reserva.vetId);
      const m = Mascotas.get(reserva.mascotaId);
      document.getElementById('resumenPago').innerHTML = `
        <div class="flex justify-between"><span class="text-muted">Código:</span><span class="font-bold">${reserva.codigo}</span></div>
        <div class="flex justify-between"><span class="text-muted">Servicio:</span><span class="font-bold">${s ? s.nombre : '—'}</span></div>
        <div class="flex justify-between"><span class="text-muted">Profesional:</span><span class="font-bold">${v ? v.nombre : '—'}</span></div>
        <div class="flex justify-between"><span class="text-muted">Mascota:</span><span class="font-bold">${m ? `${m.nombre} (${UI.petEmoji(m.especie)})` : '—'}</span></div>
        <div class="flex justify-between"><span class="text-muted">Fecha:</span><span class="font-bold">${formatDate(reserva.fecha, { long: true })}</span></div>
        <div class="flex justify-between"><span class="text-muted">Hora:</span><span class="font-bold">${reserva.hora}</span></div>`;
      const total = formatCurrency(reserva.precio);
      document.getElementById('totalPago').textContent = total;
      document.getElementById('btnPagarTotal').textContent = total;
    }

    function renderMetodos() {
      document.getElementById('metodos').innerHTML = Pagos.metodos.map(m => {
        const sel = metodoSeleccionado === m.id ? 'selected' : '';
        return `
          <button data-id="${m.id}" class="payment-method ${sel}">
            <div class="flex items-start gap-3">
              <div class="text-3xl">${m.icono}</div>
              <div class="flex-1">
                <p class="font-bold font-display" style="color:var(--color-text);">${m.nombre}</p>
                <p class="text-xs text-muted">${m.descripcion}</p>
              </div>
              ${sel ? '<span class="text-primary font-bold text-xl">✓</span>' : ''}
            </div>
          </button>`;
      }).join('');
      document.querySelectorAll('.payment-method').forEach(el => {
        el.addEventListener('click', () => {
          metodoSeleccionado = el.dataset.id;
          renderMetodos();
          renderForm();
        });
      });
    }

    function renderForm() {
      const box = document.getElementById('metodoForm');
      if (!metodoSeleccionado) { box.innerHTML = ''; return; }
      const m = Pagos.metodos.find(x => x.id === metodoSeleccionado);
      let form = `<h3 class="font-bold font-display text-lg mb-5" style="color:var(--color-text);">2. Datos del ${m.nombre.toLowerCase()}</h3>`;
      if (metodoSeleccionado === 'yape' || metodoSeleccionado === 'plin') {
        form += `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 items-center">
            <div class="sm:col-span-2 space-y-4">
              <div>
                <label class="label-text">Número de celular</label>
                <input id="yapeNum" type="tel" class="input-field" placeholder="+56 9 9988 8777" />
              </div>
              <div>
                <label class="label-text">Código de aprobación</label>
                <input id="yapeCode" type="text" maxlength="6" class="input-field" placeholder="123456" />
              </div>
            </div>
            <div class="bg-soft p-4 rounded-2xl text-center">
              <div class="text-5xl mb-2">${m.icono}</div>
              <p class="text-xs text-muted">Abre tu app y escanea el código QR</p>
              <div class="mt-3 w-24 h-24 mx-auto bg-white rounded-lg flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="w-20 h-20"><rect x="5" y="5" width="20" height="20" fill="#1f2937"/><rect x="10" y="10" width="10" height="10" fill="#fff"/><rect x="75" y="5" width="20" height="20" fill="#1f2937"/><rect x="80" y="10" width="10" height="10" fill="#fff"/><rect x="5" y="75" width="20" height="20" fill="#1f2937"/><rect x="10" y="80" width="10" height="10" fill="#fff"/><rect x="30" y="30" width="5" height="5" fill="#1f2937"/><rect x="40" y="35" width="5" height="5" fill="#1f2937"/><rect x="50" y="30" width="5" height="5" fill="#1f2937"/><rect x="60" y="40" width="5" height="5" fill="#1f2937"/><rect x="35" y="50" width="5" height="5" fill="#1f2937"/><rect x="45" y="55" width="5" height="5" fill="#1f2937"/><rect x="55" y="50" width="5" height="5" fill="#1f2937"/><rect x="65" y="60" width="5" height="5" fill="#1f2937"/><rect x="35" y="65" width="5" height="5" fill="#1f2937"/><rect x="50" y="70" width="5" height="5" fill="#1f2937"/><rect x="65" y="75" width="5" height="5" fill="#1f2937"/><rect x="75" y="30" width="5" height="5" fill="#1f2937"/><rect x="85" y="40" width="5" height="5" fill="#1f2937"/></svg>
              </div>
            </div>
          </div>`;
      } else if (metodoSeleccionado === 'tarjeta') {
        form += `
          <div class="space-y-4">
            <div>
              <label class="label-text">Nombre del titular</label>
              <input id="tarjNombre" type="text" class="input-field" placeholder="Como aparece en la tarjeta" />
            </div>
            <div>
              <label class="label-text">Número de tarjeta</label>
              <input id="tarjNum" type="text" class="input-field" placeholder="1234 5678 9012 3456" maxlength="19" />
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div>
                <label class="label-text">Mes</label>
                <input id="tarjMes" type="text" class="input-field" placeholder="MM" maxlength="2" />
              </div>
              <div>
                <label class="label-text">Año</label>
                <input id="tarjAnio" type="text" class="input-field" placeholder="AA" maxlength="4" />
              </div>
              <div>
                <label class="label-text">CVV</label>
                <input id="tarjCvv" type="text" class="input-field" placeholder="123" maxlength="4" />
              </div>
            </div>
          </div>`;
      } else if (metodoSeleccionado === 'efectivo') {
        form += `
          <div class="bg-secondary/10 border border-secondary/30 rounded-2xl p-5">
            <div class="flex items-start gap-3">
              <div class="text-3xl">💵</div>
              <div>
                <p class="font-bold mb-1" style="color:var(--color-text);">Pago en consultorio</p>
                <p class="text-sm text-muted leading-relaxed">Pagarás el monto total al llegar a la clínica. Aceptamos efectivo y todas las tarjetas. Recuerda llegar 10 minutos antes.</p>
              </div>
            </div>
          </div>`;
      }
      box.innerHTML = form;
    }

    document.getElementById('btnPagar').addEventListener('click', () => {
      if (!metodoSeleccionado) { UI.toast('Selecciona un método de pago', 'warning'); return; }
      if (!document.getElementById('chkAcepto').checked) { UI.toast('Debes confirmar el cobro', 'warning'); return; }

      if (metodoSeleccionado === 'tarjeta') {
        const num = document.getElementById('tarjNum').value;
        const mes = document.getElementById('tarjMes').value;
        const anio = document.getElementById('tarjAnio').value;
        const cvv = document.getElementById('tarjCvv').value;
        const err = Pagos.validateTarjeta(num, mes, anio, cvv);
        if (err) { UI.toast(err, 'error'); return; }
      }
      if (metodoSeleccionado === 'yape' || metodoSeleccionado === 'plin') {
        const num = document.getElementById('yapeNum') ? document.getElementById('yapeNum').value.trim() : '';
        const code = document.getElementById('yapeCode') ? document.getElementById('yapeCode').value.trim() : '';
        if (!num) { UI.toast('Ingresa tu número', 'error'); return; }
        if (!code || code.length < 4) { UI.toast('Ingresa el código de aprobación', 'error'); return; }
      }

      Reservas.pay(reserva.id, metodoSeleccionado);
      PagoDraft.clear();
      UI.toast('¡Pago procesado con éxito!', 'success');
      setTimeout(() => location.href = 'payment-confirmed.html?id=' + reserva.id, 800);
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (!reserva) return;
      renderResumen();
      renderMetodos();
      renderForm();

      const tarjNum = document.getElementById('tarjNum');
      if (tarjNum) {
        tarjNum.addEventListener('input', (e) => { e.target.value = Pagos.formatCardNumber(e.target.value); });
      }
    });
  </script>
</body>
</html>
